name: Build

on:
  push:
    branches: [ master, dev ]
  # Every pull request, including stacked ones that target another feature branch
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Fails fast on unformatted code; fix locally with `mvn spotless:apply`
      - name: Check formatting
        run: mvn -B -ntp spotless:check

      # Runs the tests against PostgreSQL in Testcontainers and enforces the JaCoCo coverage threshold
      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  # The private image the server deploys (deploy/deploy.sh), built from master once the tests pass.
  # Pushed with the token of the run only, no stored secrets.
  image:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Build and push the image
        env:
          IMAGE: ghcr.io/andrej5768/webwallet
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:master" -t "$IMAGE:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          docker push --all-tags "$IMAGE"
          docker logout ghcr.io
