# Telegram bot (HTML of the Bot API; arguments make the text a MessageFormat pattern)
bot.help=To record an operation, just write:\n<code>150 coffee</code> — an expense\n<code>+5000 salary</code> — an income\n<code>2000 mono cash</code> — a transfer\n<code>89.90 taxi yesterday</code> — with a date\n\nA transfer is two accounts in the message: from, then to. Or press "It is a transfer" under an expense.\n\n/balance — balances of the accounts\n/today, /month — spending of the day and the month\n/planned — planned payments for 30 days\n/help — this help, /stop — disconnect\n\nWhat to send is set in WebWallet: Settings → Notifications.
