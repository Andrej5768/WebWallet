<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100">
<head th:replace="fragment/head :: head(~{::title},~{})">
    <title th:utext="#{label.pages.home.title}">home</title>
</head>
<body class="d-flex flex-column h-100">
<div th:replace="fragment/navBar :: nav"></div>
<div class="container">
    <h1 id="error" class="alert alert-danger" th:if="${session[SPRING_SECURITY_LAST_EXCEPTION]}"
        th:utext="#{message.logoutError}">error</h1>

    <h1 id="success" class="alert alert-info" th:if="${param.logSucc}" th:utext="#{message.logoutSucc}"> success</h1>
    <br/><br/><br/>
    <a class="btn btn-primary" th:href="@{/login}" th:utext="#{label.form.loginLink}">login</a>
</div>
<div th:replace="fragment/footer :: footer"></div>
</body>

</html>
