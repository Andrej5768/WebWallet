<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100">
<head th:replace="fragment/head :: head(~{::title},~{})">
    <title th:utext="#{label.pages.index.title}">Web Wallet</title>
</head>
<body class="d-flex flex-column h-100">
<div th:replace="fragment/navBar :: nav"></div>
<main class="flex-shrink-0">
    <div class="container my-5">
        <div class="row p-4 pb-0 pe-lg-0 pt-lg-5 align-items-center rounded-3 border shadow-lg">
            <div class="col-lg-7 p-3 p-lg-5 pt-lg-3">
                <h1 class="display-4 fw-bold" th:utext="#{label.pages.index.messageMain}">Web Wallet</h1>
                <p class="lead mb-4" th:utext="#{label.pages.index.message}">message</p>
                <div class="d-grid gap-2 d-md-flex justify-content-md-start mb-4 mb-lg-3">
                    <a type="button" class="btn btn-primary btn-lg px-4 me-sm-3" href="#" th:href="@{/login}"
                       th:utext="#{label.form.loginBtn}">Login</a>
                    <a type="button" class="btn btn-outline-secondary btn-lg px-4" href="#" th:href="@{/registration.html}"
                       th:utext="#{label.form.signUpBtn}">Secondary</a>
                </div>
            </div>
            <div class="col-lg-4 offset-lg-1 p-0 overflow-hidden shadow-lg">
                <img src="/img/index.png" th:src="@{/img/index.png}" class="img-fluid border rounded-3 shadow-lg mb-4"
                     alt="Main image" width="626" height="626" loading="lazy">
            </div>
        </div>
    </div>
</main>

<div th:replace="fragment/footer :: footer"></div>
</body>
</html>
