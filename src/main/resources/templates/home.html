<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100">
<head th:replace="fragment/head :: head(~{::title},~{})">
    <title th:utext="#{label.pages.home.title}">home</title>
</head>
<body class="d-flex flex-column h-100">
<div th:replace="fragment/navBar :: nav"></div>
    <div class="container">
            <h1 th:utext="#{label.pages.home.message}">home</h1>
    </div>
<div class="container">
    <a class="btn btn-info" href="#" th:href="@{/accounts/all}"> Accounts List </a>
</div>

<div class="container">
    <div sec:authorize="hasAuthority('WRITE_PRIVILEGE')" th:utext="#{label.pages.user.message}">user</div>

    <div sec:authorize="hasAuthority('WRITE_PRIVILEGE')" th:utext="#{label.pages.admin.message}"></div>

    <p th:if="${param.user} != null" th:text="${param.user[0]}">user</p>

    <a class="btn btn-default" th:href="@{/admin.html}" th:utext="#{label.pages.admin}">admin</a>
    <br/> <br/>
    <a th:href="@{/loggedUsers}" th:utext="#{label.pages.users.message}">View logged in users</a>
    <br/>
    <a th:href="@{/loggedUsersFromSessionRegistry}" th:utext="#{label.pages.users.sessionregistry.message}">View logged
        in users</a>

</div>

<div th:replace="fragment/footer :: footer"></div>
</body>

</html>
