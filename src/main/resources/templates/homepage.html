<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragment/head :: head(~{::title},~{::script})">
    <title th:utext="#{label.pages.home.title}">home</title>
    <script th:src="@{/resources/dashboard.js}"></script>
</head>
<body class="d-flex flex-column h-100">
<div th:replace="fragment/navBar :: nav"></div>

<div class="container">
    <a class="btn btn-info" href="#" th:href="@{/accounts/all}"> Accounts List </a>
</div>
<main>
    <div class="row my-3">
        <div class="col">
            <div class="d-grid gap-2">
                <a class="btn btn-primary" th:href="@{/wallet.html}" th:utext="#{label.form.walletBtn}">link</a>
            </div>
        </div>
        <div class="col">
            <div class="d-grid gap-2">
                <a class="btn btn-primary" th:href="@{/transactions.html}" th:utext="#{label.form.transactionBtn}">link</a>
            </div>
            <!--    TODO-->
        </div>
        <div class="col">
            <div class="d-grid gap-2">
                <a class="btn btn-primary" th:href="@{/invest.html}" th:utext="#{label.form.investBtn}">link</a>
            </div>
        </div>
    </div>


    <div class="row">
        <div class="col-3">
            <div class="position-sticky pt-3 sidebar-sticky">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <span data-feather="home" class="align-text-bottom"></span>
                            Dashboard
                        </a>
                    </li>
                </ul>

                <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted">
                    <span>Saved reports</span>
                    <a class="link-secondary" href="#" aria-label="Add a new report">
                        <span data-feather="plus-circle" class="align-text-bottom"></span>
                    </a>
                </h6>
                <ul class="nav flex-column mb-2">
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <span data-feather="file-text" class="align-text-bottom"></span>
                            Current month
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="col-8">
            <div class=" px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Dashboard</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary">Share</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary">Export</button>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-secondary dropdown-toggle">
                            <span data-feather="calendar" class="align-text-bottom"></span>
                            This week
                        </button>
                    </div>
                </div>

                <canvas class="my-4 w-100" id="myChart" width="900" height="380"></canvas>

                <h2>Section title</h2>
                <div class="table-responsive">
                    <table class="table table-striped table-sm">
                        <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Header</th>
                            <th scope="col">Header</th>
                            <th scope="col">Header</th>
                            <th scope="col">Header</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>1,001</td>
                            <td>random</td>
                            <td>data</td>
                            <td>placeholder</td>
                            <td>text</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
<div th:replace="fragment/footer :: footer"></div>
</html>
