<html>

<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.2/css/bootstrap.min.css"/>
    <title>Transaction</title>
</head>
<body>
<nav class="navbar navbar-default">
    <div class="container-fluid">
        <div class="navbar-header">
            <a class="navbar-brand" th:href="@{/homepage.html}" th:utext="#{label.pages.home.title}">home</a>
        </div>
        <ul class="nav navbar-nav navbar-right">
            <li><a th:href="@{/logout}" th:utext="#{label.pages.logout}">logout</a></li>
        </ul>
    </div>
</nav>
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h1> Transaction </h1>
            <!--            <h1 th:text="#{${account.name}}">name</h1>-->
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <form action="#" class="form-horizontal"
                  th:action="@{/accounts/transaction/save}"
                  th:object="${form}"
                  method="post">
                <fieldset>
                    <table class="table">
                        <tbody>
                        <tr>
                            <td><input th:placeholder="Account" type="hidden" name="accountId"
                                       value="${account.getId()}"></td>
                            <td><input th:placeholder="Amount" name="amount" type="number"></td>
                            <td><input th:placeholder="Remark" name="remark"></td>
                            <td><input th:placeholder="Date" name="date" type="date"></td>
                            <td>
                                <select name="transactionType">
                                    <option th:each="type : ${types}"
                                            th:value="${type}"
                                            th:text="#{${type}}">TransactionType
                                    </option>
                                </select>
                            </td>
                            <td><input type="submit" id="submitButton" class="btn btn-success" th:value="Save"></td>
                        </tr>
                        </tbody>
                    </table>
                </fieldset>
            </form>
            <table class="table">
                <thead>
                <tr>
                    <th> Date</th>
                    <th> Amount</th>
                    <th> Type</th>
                    <th> Remark</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${transactions.isEmpty}">
                    <td colspan="2"> No transaction Available</td>
                </tr>
                <tr th:each="transaction : ${transactions}">
                    <td><span th:text="${transaction.date}"> Date </span></td>
                    <td><span th:text="${transaction.amount}"> Amount </span></td>
                    <td><span th:text="${transaction.transactionType}"> Type </span></td>
                    <td><span th:text="${transaction.remark}"> Remark </span></td>
                </tr>
                </tbody>
            </table>
        </div>
        <!--        <div class="col-md-6">-->
        <!--            <a class="btn btn-success" href="#" th:href="@{/accounts/transaction/create}"> Add transactions </a>-->
        <!--            <a class="btn btn-primary" href="#" th:href="@{/accounts/transaction/edit}"-->
        <!--               th:classappend="${transactions.isEmpty} ? 'disabled' : ''"> Edit transactions </a>-->
        <!--        </div>-->
    </div>
</div>
</body>
</html>
