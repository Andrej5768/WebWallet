<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100">
<head th:replace="fragment/head :: head(~{::title},~{})">
    <title th:utext="#{message.resetPassword}">reset</title>
</head>
<body class="d-flex flex-column h-100">
<div th:replace="fragment/navBar :: nav"></div>
<div class="container mt-4" style="max-width: 400px">
    <h1 class="text-center" th:utext="#{message.resetPassword}">reset</h1>
    <br/>
    <div class="row">
        <form action="#">
            <label class="col-sm-1" th:utext="#{label.user.email}">email</label>
            <span class="col-sm-5"><input class="form-control" id="email" name="email" type="email" value=""
                                          required="required"/></span>
            <div class="d-grid gap-2 mt-2">
                <button class="btn btn-primary" type="submit" th:utext="#{message.resetPassword}">reset</button>
            </div>
        </form>
    </div>

    <br/>
    <div class=" text-center">
        <div class="row">
            <div class="col">
                <div class="d-grid gap-2">
                    <a class="btn btn-primary" th:href="@{/registration.html}" th:utext="#{label.form.loginSignUp}">registration</a>
                </div>
            </div>
            <div class="col">
                <div class="d-grid gap-2">
                    <a class="btn btn-primary" th:href="@{/login}" th:utext="#{label.form.loginLink}">login</a>
                </div>
            </div>
        </div>


    </div>
</div>
<div th:replace="fragment/footer :: footer"></div>
<script src="http://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
<script th:inline="javascript">
    var serverContext = [[@{/}]];

        $(document).ready(function () {
            $('form').submit(function (event) {
                resetPass(event);
            });
        });

    function resetPass(event) {
        event.preventDefault();
        var email = $("#email").val();
        $.post(serverContext + "user/resetPassword", {email: email}, function (data) {
            window.location.href = serverContext + "login?message=" + data.message;
        })
            .fail(function (data) {
                if (data.responseJSON.error.indexOf("MailError") > -1) {
                    window.location.href = serverContext + "emailError.html";
                } else {
                    window.location.href = serverContext + "login?message=" + data.responseJSON.message;
                }
            });
    }

    $(document).ajaxStart(function () {
        $("title").html("LOADING ...");
    });
</script>
</body>

</html>
