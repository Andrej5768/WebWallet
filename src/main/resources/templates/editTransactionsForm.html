<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100">
<head th:replace="fragment/head :: head(~{::title},~{})">
    <title th:utext="#{label.pages.transaction.title}">title</title>
</head>
<body class="d-flex flex-column h-100">
<div th:replace="fragment/navBar :: nav"></div>
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h1> Edit transactions </h1>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <a class="btn btn-info" href="#" th:href="@{/transactions/all}"> Back to All transactions </a>
            <form action="#" class="form-horizontal"
                  th:action="@{/transactions/saveAll}"
                  th:object="${form}"
                  method="post">
                <fieldset>
					<span class="pull-right">
						    <input type="submit" id="submitButton" class="btn btn-success" th:value="#{label.form.submit}">
						    <input type="reset" id="resetButton" class="btn btn-danger" th:value="Reset"/>
					</span>
                    <table class="table">
                        <thead>
                        <tr>
                            <th></th>
                            <th th:utext="#{label.transaction.date}"> Date</th>
                            <th th:utext="#{label.transaction.type}"> Type</th>
                            <th th:utext="#{label.transaction.balance}"> Amount</th>
                            <th th:utext="#{label.transaction.account}"> Account</th>
                            <th th:utext="#{label.transaction.remark}"> Remark</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${form.transactions.isEmpty()}">
                            <td colspan="6"> No transaction</td>
                        </tr>
                        <tr th:each="transaction, itemStat : ${form.transactions}">
                            <td><input hidden th:name="|transactions[${itemStat.index}].id|" th:value="${transaction.getId()}"/>
                            </td>
                            <td><input type="date" th:name="|transactions[${itemStat.index}].date|"
                                       th:value="${transaction.getDate() == null ? '' : #dates.format(transaction.getDate(), 'yyyy-MM-dd')}"
                                       required/></td>
                            <td>
                                <select th:name="|transactions[${itemStat.index}].type|" required>
                                    <option th:each="type : ${types}"
                                            th:value="${type}"
                                            th:text="#{${type}}"
                                            th:selected="${type == transaction.getType()}">TransactionType
                                    </option>
                                </select>
                            </td>
                            <td><input type="number" step="0.01" th:name="|transactions[${itemStat.index}].amount|"
                                       th:value="${transaction.getAmount()}" required/></td>
                            <td>
                                <select th:name="|transactions[${itemStat.index}].account|" required>
                                    <option th:each="account : ${accounts}"
                                            th:value="${account.getId()}"
                                            th:text="${account.getName()}"
                                            th:selected="${transaction.getAccount() != null && account.getId() == transaction.getAccount().getId()}">Account
                                    </option>
                                </select>
                            </td>
                            <td><input th:name="|transactions[${itemStat.index}].remark|"
                                       th:value="${transaction.getRemark()}"/></td>
                        </tr>
                        </tbody>
                    </table>
                </fieldset>
            </form>
        </div>
    </div>
</div>
<div th:replace="fragment/footer :: footer"></div>
</body>
</html>
