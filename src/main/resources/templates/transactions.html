<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100">
<head th:replace="fragment/head :: head(~{::title},~{})">
    <title th:utext="#{label.pages.transaction.title}">title</title>
</head>
<body class="d-flex flex-column h-100">
<div th:replace="fragment/navBar :: nav"></div>
<main>
    <!--    TODO-->
    <div class="accordion" id="accordionExample">
        <div class="accordion-item">
            <h2 class="accordion-header list-group-item" id="headingOne">
                <button
                        class="accordion-button"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapseOne"
                        aria-expanded="true"
                        aria-controls="collapseOne"
                        th:utext="#{label.transaction.add}"
                >
                    Add transaction
                </button>
            </h2>
            <div
                    id="collapseOne"
                    class="accordion-collapse collapse show"
                    aria-labelledby="headingOne"
                    data-bs-parent="#accordionExample"
            >
                <div class="accordion-body">
                    <form
                            action="#"
                            class="form-horizontal"
                            th:action="@{/transactions/save}"
                            th:object="${form}"
                            method="post"
                    >
                        <fieldset>
                            <div class="row m-1">
                                <div class="col" th:utext="#{label.transaction.date}">date</div>
                                <div class="col">
                                    <input type="date" name="date"/>
                                </div>
                            </div>
                            <div class="row m-1">
                                <div class="col" th:utext="#{label.transaction.category}">category</div>
                                <div class="col">
<!--                                    <input th:utext="#{label.transaction.date}" name="name"/>-->
                                    <select id="category" name="category">
                                        <option th:each="i : ${#numbers.sequence(0, 100)}" th:value="${i}" th:text="${i}"
                                                th:selected="${i==75}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="row m-1">
                                <div class="col" th:utext="#{label.transaction.balance}">balance</div>
                                <div class="col">
                                    <input th:placeholder="#{label.transaction.balance}" type="number" name="balance"/>
                                </div>
                            </div>
                            <div class="row m-1">
                                <div class="col" th:utext="#{label.transaction.account}">Account</div>
                                <div class="col">
                                    <select id="account" name="account">
                                        <option th:each="i : ${#numbers.sequence(0, 100)}" th:value="${i}" th:text="${i}"
                                                th:selected="${i==75}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col"></div>
                                <div class="col text-center">
                                    <input
                                            type="submit"
                                            id="submitButton"
                                            class="btn btn-success"
                                            th:value="#{label.form.submit}"
                                    />
                                </div>
                            </div>
                        </fieldset>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-sm table-hover">
            <thead>
            <tr>
                <th scope="col" th:utext="#{label.transaction.id}">id *debug</th>
                <th scope="col" th:utext="#{label.transaction.date}">date</th>
                <th scope="col" th:utext="#{label.transaction.category}">category</th>
                <th scope="col" th:utext="#{label.transaction.balance}">price</th>
                <th scope="col" th:utext="#{label.transaction.account}">account</th>
                <th scope="col">action</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>1,001</td>
                <td>random</td>
                <td>data</td>
                <td>placeholder</td>
                <td>text</td>
                <td class="d-flex text-nowrap">
                    <a
                            class="btn btn-primary btn-sm"
                            data-bs-toggle="collapse"
                            href="#collapseExample"
                            role="button"
                            aria-expanded="false"
                            aria-controls="collapseExample"
                    >
                        C
                    </a>

                    <button type="button" class="btn btn-danger btn-sm">X</button>
                </td>


            </tr>
            <tr>
                <td colspan="6">
                    <div class="collapse" id="collapseExample">
                        <div class="card card-body">
                            Some placeholder content for the collapse component. This panel
                            is hidden by default but revealed when the user activates the
                            relevant trigger.
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>

        </table>
    </div>
</main>

<div th:replace="fragment/footer :: footer"></div>
</body>
</html>
