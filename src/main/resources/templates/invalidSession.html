</head>
<body class="d-flex flex-column h-100">
<div th:replace="fragment/navBar :: nav"></div>
<div class="container">
    <h1 class="alert alert-danger" th:utext="#{message.sessionExpired}">expired</h1>
    <div class="container text-center mt-5">
        <a class="btn btn-primary" th:href="@{/login}" th:utext="#{label.form.loginLink}">login</a>

    </div>
</div>
<div th:replace="fragment/footer :: footer"></div>

</html>
