<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100">
<head th:replace="fragment/head :: head(~{::title},~{::script})">
    <title th:utext="#{label.pages.home.title}">Title</title>
    <script th:inline="javascript">
        function validate() {
            if (document.f.username.value == "" && document.f.password.value == "") {
                alert(/*[[#{message.username} + #{message.password}]]*/);
                document.f.username.focus();
                return false;
            }
            if (document.f.username.value == "") {
                alert(/*[[#{message.username}]]*/);
                document.f.username.focus();
                return false;
            }
            if (document.f.password.value == "") {
                alert(/*[[#{message.password}]]*/);
                document.f.password.focus();
                return false;
            }
        }

    </script>
</head>

<body class="d-flex flex-column h-100">
<div th:replace="fragment/navBar :: nav"></div>
<div class="container-sm">
    <div th:if="${message != null}" class="alert alert-info" th:utext="${message}">message</div>


    <div th:if="${error != null}" class="alert alert-danger" th:utext="${session[SPRING_SECURITY_LAST_EXCEPTION]}">
        error
    </div>

    <div class="container text-center " style="max-width: 400px">
        <div class="row p-4 pb-0 pe-lg-0 pt-lg-5 align-items-center rounded-3 border shadow-lg mt-5">
            <div class="row wrapper">
                <h1 th:utext="#{label.form.loginTitle}">Header</h1>

                <br/><br/>

                <form name='f' action="login" method='POST' onsubmit="return validate();">
                    <span id="welcometext">&nbsp;</span>

                    <br/><br/>
                    <label class="col-sm-4 d-flex justify-content-left" th:utext="#{label.form.loginEmail}">Email</label>
                    <span class="col-sm-8"><input class="form-control" type='text' name='username' value='' placeholder="Type your email"/></span>
                    <span class="focus-input100" data-symbol="&#xf206;"></span>

                    <br/>
                    <label class="col-sm-4 d-flex justify-content-left" th:utext="#{label.form.loginPass}">password</label>
                    <span class="col-sm-8 "><input class="form-control" type='password' name='password' placeholder="Type your password"/></span>
                    <div class="d-flex justify-content-end">
                        <a class="btn btn-default" th:href="@{/forgetPassword.html}" th:utext="#{message.resetPassword}">reset</a>
                    </div>

                    <br/>
                    <div class="d-grid gap-2">
                        <input class="btn btn-primary d-grid gap-2" name="submit" type="submit" th:value="#{label.form.submit}"/>
                    </div>
                    <label th:utext="#{label.form.rememberMe}"> Remember Me</label>
                    <input type="checkbox" name="remember-me"/>

                </form>
                <br/>
                <br/>
                <div class="mt-5 d-grid gap-2 mb-5"> <span class="text-left">Dont have account?</span><br/>
                    <a class="btn btn-primary" th:href="@{/registration.html}" th:utext="#{label.form.loginSignUp}">signup</a></div>

                <br/><br/>

            </div>
        </div>
    </div>
</div>

</div>
</body>
<div th:replace="fragment/footer:: footer"></div>
</html>
