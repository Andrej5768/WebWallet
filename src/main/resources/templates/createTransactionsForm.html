<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100">
<head th:replace="fragment/head :: head(~{::title},~{})">
    <title th:utext="#{label.pages.transactionCreate.title}">Create transaction</title>
</head>
<body class="d-flex flex-column h-100">
<div th:replace="fragment/navBar :: nav"></div>
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h1 th:utext="#{label.transaction.add}"> Add transaction </h1>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <a class="btn btn-info" href="#" th:href="@{/transactions/all}"> Back to All transactions </a>
            <form action="#" class="form-horizontal"
                  th:action="@{/transactions/save}"
                  method="post">
                <fieldset>
                    <table class="table">
                        <tbody>
                        <tr>
                            <td><input th:placeholder="#{label.transaction.date}" name="date" type="date" required></td>
                            <td><input th:placeholder="#{label.transaction.balance}" name="amount" type="number" step="0.01" required></td>
                            <td>
                                <select name="account" required>
                                    <option value="" hidden>Select an account</option>
                                    <option th:each="account : ${accounts}"
                                            th:value="${account.name}"
                                            th:text="${account.name}">Account
                                    </option>
                                </select>
                            </td>
                            <td>
                                <select name="transactionType" required>
                                    <option th:each="type : ${types}"
                                            th:value="${type}"
                                            th:text="#{${type}}">TransactionType
                                    </option>
                                </select>
                            </td>
                            <td><input th:placeholder="#{label.transaction.remark}" name="remark"></td>
                            <td><input type="submit" id="submitButton" class="btn btn-success" th:value="#{label.form.submit}"></td>
                        </tr>
                        </tbody>
                    </table>
                </fieldset>
            </form>
        </div>
    </div>
</div>
<div th:replace="fragment/footer :: footer"></div>
</body>
</html>
