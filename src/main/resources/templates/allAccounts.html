<html>

<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.2/css/bootstrap.min.css"/>
    <title>Card and accounts</title>
</head>
<body>
<nav class="navbar navbar-default">
    <div class="container-fluid">
        <div class="navbar-header">
            <a class="navbar-brand" th:href="@{/homepage.html}" th:utext="#{label.pages.home.title}">home</a>
        </div>
        <ul class="nav navbar-nav navbar-right">
            <li><a th:href="@{/logout}" th:utext="#{label.pages.logout}">logout</a></li>
        </ul>
    </div>
</nav>
<div class="container">
    <h3>Card and accounts</h3>
    <div class="row">
        <div class="col-md-12">
            <h1> Accounts </h1>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <table class="table">
                <thead>
                <tr>
                    <th> Name</th>
                    <th> Amount</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${accounts.isEmpty}">
                    <td colspan="2"> No accounts or Card Available</td>
                </tr>
                <tr th:each="account : ${accounts}">
                    <td><form action="#" class="form-horizontal"
                              th:action="@{/accounts/transaction/all}"
                              th:object="${account}"
                              method="post"> <input type="submit" id="submit" class="btn btn-success" th:value="${account.name}"> </form></td>
                    <td><span th:text="${account.amount}"> Amount </span></td>
                </tr>
                </tbody>
            </table>
            <form action="#" class="form-horizontal"
                  th:action="@{/accounts/save}"
                  th:object="${form}"
                  method="post">
                <fieldset>
                    <table class="table">
                        <tbody>
                        <tr >
                            <td><input th:placeholder="Name" name="name"></td>
                            <td><input th:placeholder="Amount" name="amount"></td>
                            <td><input type="submit" id="submitButton" class="btn btn-success" th:value="Save"></td>
                        </tr>
                        </tbody>
                    </table>
                </fieldset>
            </form>
        </div>
        <div class="col-md-6">
            <a class="btn btn-success" href="#" th:href="@{/accounts/create}"> Add accounts </a>
            <a class="btn btn-primary" href="#" th:href="@{/accounts/edit}"
               th:classappend="${accounts.isEmpty} ? 'disabled' : ''"> Edit accounts </a>
        </div>
    </div>
</div>
</body>
</html>
