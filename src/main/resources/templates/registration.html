<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100">
<head>
    <meta charset="utf-8">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
    <link rel="manifest" href="img/site.webmanifest">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.2/assets/css/docs.css" rel="stylesheet">
    <style>
        .password-verdict{
            color:#000;
        }
    </style>
    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <script th:src="@{/resources/pwstrength.js}"></script>
    <meta http-equiv="Content-Type" content="text/html; charset=US-ASCII"/>
    <title th:utext="#{label.form.title}">form</title>
</head>
<body class="d-flex flex-column h-100">
<div th:replace="fragment/navBar :: nav"></div>
<main class="container mt-5" style="max-width: 500px">
    <div class="form-signin m-auto">
        <div>
            <h1 class="text-center" th:utext="#{label.form.title}">form</h1>
            <br/>
            <form action="/" method="POST" enctype="utf8">
                <div class="form-floating mb-3">
                    <input id="firstName" class="form-control rounded-3" placeholder="John" name="firstName" value=""
                           required="required">
                    <label for="firstName" th:utext="#{label.user.firstName}">first</label>
                    <span id="firstNameError" class="alert alert-danger col-sm-4" style="display:none"></span>
                </div>

                <div class="form-floating mb-3">
                    <input id="lastName" class="form-control rounded-3" placeholder="Doe" name="lastName" value=""
                           required="required">
                    <label for="lastName" class="col-sm-3" th:utext="#{label.user.lastName}">last</label>
                    <span id="lastNameError" class="alert alert-danger col-sm-4" style="display:none"></span>
                </div>

                <div class="form-floating mb-3">
                    <input id="email" type="email" class="form-control rounded-3" placeholder="example@mail.com"
                           name="email" value=""
                           required="required">
                    <label for="email" class="col-sm-3" th:utext="#{label.user.email}">email</label>
                    <span id="emailError" class="alert alert-danger col-sm-4" style="display:none"></span>
                </div>

                <div class="form-floating mb-3">
                    <input id="password" type="password" class="form-control rounded-3"
                           placeholder="qwerty"
                           name="password" value="" required="required" autocomplete="new-password">
                    <label for="password" class="col-sm-3" th:utext="#{label.user.password}">password</label>
                    <span id="passwordError" class="alert alert-danger col-sm-4" style="display:none"></span>
                </div>

                <div class="form-floating mb-3">
                    <input id="matchPassword" type="password" class="form-control rounded-3" placeholder="qwerty"
                           name="matchingPassword" value=""
                           required="required" autocomplete="new-password">
                    <label for="matchPassword" class="col-sm-3" th:utext="#{label.user.confirmPass}">confirm</label>
<!--                    <span id="globalError" class="alert alert-danger col-sm-4" style="display:none"></span>-->
                </div>
                <span id="globalError" class="alert alert-danger col-sm-4 m-auto" style="display:none"></span>

                <div class="mt-5 d-grid gap-2">
                    <button type="submit" class="btn btn-primary" th:utext="#{label.form.submit}">submit</button>
                </div>

            </form>

            <div class="mt-5 d-grid gap-2"><span>Already have account?</span><br/>
                <a class="btn btn-primary" th:href="@{/login}" th:utext="#{label.form.loginLink}">login</a></div>

        </div>
    </div>
</main>


<div th:replace="fragment/footer:: footer"></div>

<script th:inline="javascript">
    var serverContext = [[@{/}]];

        $(document).ready(function () {
            $('form').submit(function (event) {
                register(event);
            });

            $(":password").keyup(function () {
                if ($("#password").val() != $("#matchPassword").val()) {
                    $("#globalError").show().html(/*[[#{PasswordMatches.user}]]*/);
                } else {
                    $("#globalError").html("").hide();
                }
            });

            options = {
                common: {minChar: 8},
                ui: {
                    showVerdictsInsideProgressBar: true,
                    showErrors: true,
                    errorMessages: {
                        wordLength: /*[[#{error.wordLength}]]*/,
                        wordNotEmail: /*[[#{error.wordNotEmail}]]*/,
                        wordSequences: /*[[#{error.wordSequences}]]*/,
                        wordLowercase: /*[[#{error.wordLowercase}]]*/,
                        wordUppercase: /*[[#{error.wordUppercase}]]*/,
                        wordOneNumber: /*[[#{error.wordOneNumber}]]*/,
                        wordOneSpecialChar: /*[[#{error.wordOneSpecialChar}]]*/
                    }
                }
            };
            $('#password').pwstrength(options);
        });

    function register(event) {
        event.preventDefault();
        $(".alert").html("").hide();
        $(".error-list").html("");
        if ($("#password").val() != $("#matchPassword").val()) {
            $("#globalError").show().html(/*[[#{PasswordMatches.user}]]*/);
            return;
        }
        var formData = $('form').serialize();
        $.post(serverContext + "user/registration", formData, function (data) {
            if (data.message == "success") {
                window.location.href = serverContext + "successRegister.html";
            }

        })
            .fail(function (data) {
                if (data.responseJSON.error.indexOf("MailError") > -1) {
                    window.location.href = serverContext + "emailError.html";
                } else if (data.responseJSON.error == "UserAlreadyExist") {
                    $("#emailError").show().html(data.responseJSON.message);
                } else if (data.responseJSON.error.indexOf("InternalError") > -1) {
                    window.location.href = serverContext + "login?message=" + data.responseJSON.message;
                } else {
                    var errors = $.parseJSON(data.responseJSON.message);
                    $.each(errors, function (index, item) {
                        if (item.field) {
                            $("#" + item.field + "Error").show().append(item.defaultMessage + "<br/>");
                        } else {
                            $("#globalError").show().append(item.defaultMessage + "<br/>");
                        }

                    });
                }
            });
    }

</script>
</body>

</html>
