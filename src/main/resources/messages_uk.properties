# Telegram bot (HTML of the Bot API; arguments make the text a MessageFormat pattern)
bot.help=Щоб записати операцію, просто напишіть:\n<code>150 кава</code> — витрата\n<code>+5000 зарплата</code> — дохід\n<code>2000 моно готівка</code> — переказ\n<code>89,90 таксі вчора</code> — з датою\n\nПереказ — це два рахунки в повідомленні: звідки, потім куди. Або натисніть «Це переказ» під витратою.\n\n/balance — баланси рахунків\n/today, /month — витрати за день і місяць\n/planned — заплановані платежі на 30 днів\n/help — підказка, /stop — відключити\n\nЩо надсилати, налаштовується в WebWallet: Налаштування → Сповіщення.
bot.welcome=<b>Telegram підключено до WebWallet</b>\nАкаунт: {0}
bot.notLinked=Цей чат не підключено до WebWallet. Підключіть його в WebWallet: Налаштування → Сповіщення → «Підключити Telegram».
bot.linkInvalid=Посилання недійсне або застаріло. Створіть нове в WebWallet: Налаштування → Сповіщення.
bot.alreadyLinked=<b>Цей Telegram уже підключено</b>\nЩоб підключити інший акаунт WebWallet, спершу надішліть /stop.
bot.unlinked=Telegram відключено від WebWallet. Підключити знову можна в Налаштування → Сповіщення.
