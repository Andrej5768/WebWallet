mail.verification.subject=Підтвердження електронної пошти
mail.verification.body=Вітаємо!\n\nЩоб підтвердити адресу електронної пошти, відкрийте посилання:\n{0}\n\nПосилання дійсне протягом {1} год.
mail.passwordReset.subject=Скидання пароля
mail.passwordReset.body=Вітаємо!\n\nЩоб установити новий пароль, відкрийте посилання:\n{0}\n\nПосилання дійсне протягом {1} хв. Якщо ви не запитували скидання пароля, просто проігноруйте цей лист.
mail.accountDeletion.subject=Ваш акаунт буде видалено
mail.accountDeletion.body=Вітаємо!\n\nВи попросили видалити акаунт WebWallet. Зараз його заблоковано, а {1} його буде видалено разом з усіма даними.\n\nПередумали? Відкрийте посилання, щоб зберегти акаунт:\n{0}\n\nЯкщо це були не ви, відкрийте посилання й змініть пароль.
mail.accountExists.subject=У вас уже є обліковий запис
mail.accountExists.body=Вітаємо!\n\nХтось намагався зареєструватися з цією адресою електронної пошти, але обліковий запис із нею вже існує. Якщо це були ви, увійдіть або скиньте пароль:\n{0}\n\nЯкщо це були не ви, просто проігноруйте цей лист.

