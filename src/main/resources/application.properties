spring.application.name=webwallet

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webwallet}
spring.datasource.username=${DB_USERNAME:webwallet}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Loads lazy collections (splits, tags) of a page of transactions in batches instead of one by one
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# Inserts and updates of imports are sent in batches
spring.jpa.properties.hibernate.jdbc.batch_size=50
# A batch of inserts becomes one multi-row statement
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Mail (Mailpit from docker-compose by default)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# Imports: a full Zen Money export of several years is a few megabytes, a bank statement less than one
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Bank synchronization, exchange rates and the cleanups do not wait for each other
spring.task.scheduling.pool.size=4

# Banks, the NBU and Zen Money: a hanging service must not block a request or the scheduler forever
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=60s

# Localization
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Use the client IP from X-Forwarded-For only when it comes from a trusted proxy: a regular expression of the proxy
# addresses, loopback by default (e.g. TRUSTED_PROXIES=172\.18\.0\.\d+ for a reverse proxy in a Docker network)
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:127\\.\\d+\\.\\d+\\.\\d+|0:0:0:0:0:0:0:1|::1}

# OpenAPI spec and Swagger UI, enabled only for development
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
# Stable order of paths and schemas, so that the committed spec in api/openapi.json does not change by itself
springdoc.writer-with-order-by-keys=true

management.endpoints.web.exposure.include=health
# A mail server outage should not mark the whole service as unhealthy
management.health.mail.enabled=false

# Application
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:no-reply@webwallet.local}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Base64-encoded key of at least 32 bytes, e.g. `openssl rand -base64 32`
app.jwt.secret=${JWT_SECRET}
# Base64-encoded 32-byte key for secrets stored in the database (bank tokens), e.g. `openssl rand -base64 32`
app.encryption-key=${ENCRYPTION_KEY}
# Public URL of the backend; when set, a Monobank connection can use the WEBHOOK mode (the bank pushes new operations)
app.public-url=${APP_PUBLIC_URL:}
# Market data provider (https://twelvedata.com, free plan); without a key instruments are valued by hand
app.market-data.twelve-data.api-key=${TWELVE_DATA_API_KEY:}
# Dividends (https://www.alphavantage.co, free key); without it only recorded dividends and bond coupons are shown
app.market-data.alpha-vantage.api-key=${ALPHA_VANTAGE_API_KEY:}
app.jwt.issuer=webwallet
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=30d
app.auth.email-verification-ttl=24h
app.auth.password-reset-ttl=1h
# Failed logins after which the client IP and, for a shorter time, the account are blocked
app.auth.max-failed-logins=10
app.auth.login-block-duration=1h
app.auth.account-block-duration=15m
# Limits requests that send emails (registration, verification, password reset)
app.auth.max-email-requests-per-address=5
app.auth.max-email-requests-per-ip=20
app.auth.email-request-window=1h
# The refresh token is kept in an HttpOnly cookie; Secure may be disabled only for local development over HTTP
app.auth.refresh-cookie-name=refresh_token
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
