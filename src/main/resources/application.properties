spring.application.name=webwallet

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webwallet}
spring.datasource.username=${DB_USERNAME:webwallet}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Mail (Mailpit from docker-compose by default)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# Localization
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Use the client IP from X-Forwarded-For only when it comes from a trusted proxy
server.forward-headers-strategy=native

management.endpoints.web.exposure.include=health
# A mail server outage should not mark the whole service as unhealthy
management.health.mail.enabled=false

# Application
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:no-reply@webwallet.local}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Base64-encoded key of at least 32 bytes, e.g. `openssl rand -base64 32`
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=webwallet
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=30d
app.auth.email-verification-ttl=24h
app.auth.password-reset-ttl=1h
app.auth.max-failed-logins=10
app.auth.login-block-duration=24h
