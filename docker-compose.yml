# Local development: `docker compose up -d postgres mailpit` and run the backend from the IDE with the `local` profile,
# or `docker compose --profile app up --build` to run everything in containers (see .env.example for the variables).
# Ports are published on 127.0.0.1 only; put a reverse proxy with TLS in front of the backend to expose it.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webwallet
      POSTGRES_USER: webwallet
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U webwallet -d webwallet" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development only: catches all outgoing emails, web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  backend:
    build: .
    profiles: [ "app" ]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/webwallet?reWriteBatchedInserts=true
      DB_USERNAME: webwallet
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 32)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      # Mailpit by default; set a real SMTP server for production
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@webwallet.local}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # A reverse proxy on the host reaches the published port through the gateway of the network below
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172\.30\.0\.1|127\.\d+\.\d+\.\d+|0:0:0:0:0:0:0:1|::1}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

# A fixed subnet, so that the gateway address in TRUSTED_PROXIES is known
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
